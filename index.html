<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آکادمی زوم | پلتفرم آموزش و فروشگاه تخصصی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --card-2:#f8fafc; --hdr-bg:rgba(255,255,255,.85);
  --text:#0f172a; --muted:#64748b;
  --primary:#6366f1; --primary-2:#8b5cf6; --primary-soft:#eef2ff;
  --accent:#f59e0b; --success:#10b981; --danger:#ef4444;
  --border:#e2e8f0; --shadow:0 10px 30px rgba(15,23,42,.08);
  --radius:16px; --radius-sm:12px; --hdr-h:72px;
}
[data-theme="dark"]{
  --bg:#0a1020; --card:#111a2e; --card-2:#0e1628; --hdr-bg:rgba(17,26,46,.85);
  --text:#e6ecf5; --muted:#93a3b8;
  --primary:#818cf8; --primary-2:#a78bfa; --primary-soft:#1d2742;
  --border:#22304a; --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.85;transition:background .3s,color .3s}
img{max-width:100%}
a{color:inherit}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}
/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:700;text-decoration:none;transition:.2s;line-height:1.6}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.btn-primary:hover{box-shadow:0 10px 24px rgba(99,102,241,.45);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn-soft:hover{filter:brightness(1.03)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:10px}
.btn-lg{padding:14px 30px;font-size:16px;border-radius:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
/* ---------- Header ---------- */
.hdr{position:sticky;top:0;z-index:60;background:var(--hdr-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.hdr-in{display:flex;align-items:center;gap:20px;height:var(--hdr-h)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;text-decoration:none;white-space:nowrap}
.logo b{background:linear-gradient(135deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-ic{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:grid;place-items:center;color:#fff;flex-shrink:0}
.nav{display:flex;gap:4px}
.nav a{padding:8px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14.5px;transition:.2s;white-space:nowrap}
.nav a:hover{color:var(--text);background:var(--primary-soft)}
.nav a.active{color:var(--primary);background:var(--primary-soft)}
.hdr-actions{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:8px 14px;width:230px;color:var(--muted)}
.searchbox input{border:none;background:none;outline:none;font-family:inherit;color:var(--text);width:100%;font-size:14px}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.2s;flex-shrink:0}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.badge-dot{position:absolute;top:-7px;inset-inline-start:-7px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
.avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;cursor:pointer;border:none;font-family:inherit}
.user-wrap{position:relative}
.user-drop{position:absolute;top:calc(100% + 10px);inset-inline-end:0;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);min-width:210px;padding:8px;display:none;z-index:70}
.user-drop.open{display:block}
.user-drop a,.user-drop button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;background:none;border:none;font-family:inherit;font-size:14px;color:var(--text);text-decoration:none;cursor:pointer;text-align:right;transition:.15s}
.user-drop a:hover,.user-drop button:hover{background:var(--primary-soft);color:var(--primary)}
.hdr-burger{display:none}
/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#4338ca,#6d28d9 55%,#9333ea);color:#fff;padding:84px 0 96px}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{width:420px;height:420px;top:-160px;inset-inline-start:-120px}
.hero::after{width:520px;height:520px;bottom:-260px;inset-inline-end:-160px}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center;position:relative;z-index:1}
.hero-tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 18px;border-radius:99px;font-size:13px;font-weight:600}
.hero h1{font-size:42px;font-weight:900;line-height:1.5;margin:20px 0 14px}
.hero h1 b{color:#fde68a}
.hero .lead{color:rgba(255,255,255,.88);font-size:16.5px;max-width:540px}
.hero-search{display:flex;background:#fff;border-radius:14px;padding:6px;margin-top:28px;max-width:540px;box-shadow:0 16px 40px rgba(0,0,0,.22)}
.hero-search input{flex:1;border:none;outline:none;padding:10px 16px;font-family:inherit;font-size:15px;color:#0f172a;background:none;min-width:0}
.hero-btns{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.hero-stats{display:flex;gap:38px;margin-top:36px;flex-wrap:wrap}
.hero-stats b{font-size:26px;display:block;line-height:1.4}
.hero-stats span{font-size:13px;color:rgba(255,255,255,.75)}
.hero-visual{position:relative;display:flex;justify-content:center}
.hv-card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);border-radius:22px;padding:26px;width:330px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.hv-ic{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:grid;place-items:center;margin-bottom:14px}
.hv-card h3{font-size:17px;margin-bottom:6px}
.hv-card p{font-size:13px;color:rgba(255,255,255,.75)}
.hv-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);font-size:13px}
.hv-float{position:absolute;background:var(--card);color:var(--text);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);font-size:13px;font-weight:700;display:flex;align-items:center;gap:9px}
.hv-float.a{top:6%;inset-inline-end:-4%}
.hv-float.b{bottom:8%;inset-inline-start:-4%}
.hv-float .fdot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
/* ---------- Sections ---------- */
.sec{padding:72px 0}
.sec-alt{background:var(--card-2)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px;flex-wrap:wrap}
.sec-kicker{color:var(--primary);font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.sec-kicker::before{content:'';width:22px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--primary-2))}
.sec-title{font-size:28px;font-weight:900;margin-top:6px}
.sec-link{color:var(--primary);font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
/* ---------- Feature cards ---------- */
.feat-card{padding:28px 22px;text-align:center;transition:.25s}
.feat-card:hover{transform:translateY(-6px)}
.feat-ic{width:58px;height:58px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.feat-card h3{font-size:16.5px;margin-bottom:8px}
.feat-card p{font-size:13.5px;color:var(--muted)}
/* ---------- Category cards ---------- */
.cat-card{display:flex;align-items:center;gap:16px;padding:20px;text-decoration:none;transition:.25s}
.cat-card:hover{transform:translateY(-4px);border-color:var(--primary)}
.cat-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.cat-card h4{font-size:15px}
.cat-card span{font-size:12.5px;color:var(--muted)}
/* ---------- Course card ---------- */
.c-card{overflow:hidden;display:flex;flex-direction:column;height:100%;transition:.25s;text-decoration:none;position:relative}
.c-card:hover{transform:translateY(-6px);border-color:var(--primary)}
.c-thumb{height:150px;display:grid;place-items:center;color:#fff;font-size:38px;font-weight:900;letter-spacing:1px;position:relative}
.c-thumb .tagb{position:absolute;top:12px;inset-inline-start:12px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:99px}
.c-thumb .lvl{position:absolute;top:12px;inset-inline-end:12px;background:rgba(2,6,23,.45);color:#fff;font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:99px}
.c-body{padding:18px;flex:1;display:flex;flex-direction:column;gap:9px}
.c-cat{color:var(--primary);font-size:12.5px;font-weight:700}
.c-body h3{font-size:15.5px;line-height:1.7}
.c-meta{display:flex;gap:16px;color:var(--muted);font-size:12.5px;align-items:center}
.c-meta span{display:inline-flex;align-items:center;gap:5px}
.c-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;border-top:1px dashed var(--border)}
.price{font-weight:800;color:var(--primary);font-size:16px}
.price s{color:var(--muted);font-weight:500;font-size:12.5px;margin-inline-start:6px}
.price.free{color:var(--success)}
.stars{color:#f59e0b;display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700}
.tch-mini{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.tch-mini i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
/* ---------- Product card ---------- */
.p-card{overflow:hidden;display:flex;flex-direction:column;height:100%;transition:.25s;text-decoration:none;position:relative}
.p-card:hover{transform:translateY(-6px);border-color:var(--primary)}
.p-thumb{height:150px;display:grid;place-items:center;color:#fff}
.p-body{padding:16px;flex:1;display:flex;flex-direction:column;gap:8px}
.p-body h3{font-size:14.5px;line-height:1.7}
.dig-b{position:absolute;top:12px;inset-inline-start:12px;background:rgba(2,6,23,.45);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px}
.wish-b{position:absolute;top:10px;inset-inline-end:10px;width:36px;height:36px;border-radius:10px;border:none;background:rgba(255,255,255,.92);color:#64748b;display:grid;place-items:center;cursor:pointer;transition:.2s}
.wish-b:hover{color:var(--danger)}
.wish-b.on{color:var(--danger)}
.wish-b.on svg{fill:currentColor}
</style>
<style>
/* ---------- Teacher card ---------- */
.t-card{padding:26px;text-align:center;transition:.25s}
.t-card:hover{transform:translateY(-6px)}
.t-ava{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:900;box-shadow:0 10px 24px rgba(99,102,241,.35)}
.t-card h3{font-size:16px}
.t-card .role{color:var(--primary);font-size:12.5px;font-weight:700;margin-bottom:8px}
.t-card p{font-size:13px;color:var(--muted);margin-bottom:12px}
.t-stats{display:flex;justify-content:center;gap:18px;border-top:1px dashed var(--border);padding-top:14px;font-size:12.5px;color:var(--muted)}
.t-stats b{display:block;color:var(--text);font-size:15px}
/* ---------- Testimonial ---------- */
.tst-card{padding:26px;position:relative;height:100%}
.tst-card .qmark{position:absolute;top:18px;inset-inline-end:22px;font-size:60px;font-family:Georgia,serif;color:var(--primary);opacity:.14;line-height:1}
.tst-card p{font-size:14px;color:var(--muted);margin:12px 0 18px}
.tst-user{display:flex;align-items:center;gap:12px}
.tst-user i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800}
.tst-user b{font-size:14px;display:block}
.tst-user span{font-size:12px;color:var(--muted)}
/* ---------- Blog card ---------- */
.b-card{overflow:hidden;display:flex;flex-direction:column;height:100%;transition:.25s;text-decoration:none}
.b-card:hover{transform:translateY(-6px)}
.b-thumb{height:140px;display:grid;place-items:center;color:#fff;position:relative}
.b-thumb .tagb{position:absolute;top:12px;inset-inline-start:12px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);color:#fff;font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:99px}
.b-body{padding:18px;flex:1}
.b-meta{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.b-body h3{font-size:15.5px;line-height:1.7;margin-bottom:8px}
.b-body p{font-size:13px;color:var(--muted)}
/* ---------- Stats band ---------- */
.stats-band{background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;padding:58px 0}
.stats-band .grid-4{gap:16px}
.sb-item{text-align:center}
.sb-item b{font-size:34px;font-weight:900;display:block}
.sb-item span{font-size:13.5px;color:rgba(255,255,255,.8)}
/* ---------- CTA ---------- */
.cta-box{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-radius:24px;color:#fff;padding:52px 40px;display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap;position:relative;overflow:hidden}
.cta-box::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.1);top:-120px;inset-inline-end:-80px}
.cta-box h2{font-size:26px;font-weight:900;margin-bottom:8px}
.cta-box p{color:rgba(255,255,255,.85);font-size:14.5px}
.cta-form{display:flex;background:#fff;border-radius:14px;padding:6px;gap:8px;min-width:min(420px,100%)}
.cta-form input{flex:1;border:none;outline:none;padding:10px 16px;font-family:inherit;font-size:14px;color:#0f172a;background:none;min-width:0}
/* ---------- Footer ---------- */
.ftr{background:var(--card-2);border-top:1px solid var(--border);margin-top:80px}
.ftr-in{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:36px;padding:56px 0 40px}
.ftr h4{font-size:15px;margin-bottom:16px}
.ftr-in p{font-size:13.5px;color:var(--muted)}
.ftr-in ul{list-style:none}
.ftr-in ul li{margin-bottom:10px}
.ftr-in ul a{color:var(--muted);text-decoration:none;font-size:13.5px;transition:.2s}
.ftr-in ul a:hover{color:var(--primary)}
.ftr-bottom{border-top:1px solid var(--border);padding:18px 0;text-align:center;font-size:13px;color:var(--muted)}
.socials{display:flex;gap:10px;margin-top:14px}
.socials a{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);transition:.2s}
.socials a:hover{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent}
/* ---------- Page head / breadcrumb ---------- */
.page-head{background:var(--card);border-bottom:1px solid var(--border);padding:30px 0}
.crumb{display:flex;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--primary)}
.page-head h1{font-size:24px;font-weight:900}
/* ---------- Forms ---------- */
.field{margin-bottom:16px}
.field label{font-size:13.5px;font-weight:700;display:block;margin-bottom:7px}
.input{width:100%;padding:12px 15px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-family:inherit;font-size:14.5px;outline:none;transition:.2s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
textarea.input{resize:vertical;min-height:100px}
select.input{cursor:pointer}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
/* ---------- Auth ---------- */
.auth-wrap{min-height:calc(100vh - var(--hdr-h));display:grid;place-items:center;padding:44px 20px;background:var(--card-2)}
.auth-card{width:100%;max-width:450px;padding:36px}
.auth-card h1{font-size:22px;font-weight:900;margin-bottom:6px}
.auth-card .sub{font-size:13.5px;color:var(--muted);margin-bottom:24px}
.auth-alt{text-align:center;font-size:13.5px;color:var(--muted);margin-top:18px}
.auth-alt a{color:var(--primary);font-weight:700;text-decoration:none}
.demo-box{background:var(--primary-soft);border:1.5px dashed var(--primary);border-radius:12px;padding:12px 16px;font-size:12.5px;color:var(--primary);margin-top:18px;line-height:2}
/* ---------- Chips / pills ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}
.pill{display:inline-block;padding:4px 13px;border-radius:99px;font-size:12px;font-weight:700}
.pill.green{background:rgba(16,185,129,.14);color:#10b981}
.pill.blue{background:rgba(99,102,241,.14);color:#818cf8}
.pill.orange{background:rgba(245,158,11,.14);color:#f59e0b}
.pill.red{background:rgba(239,68,68,.14);color:#ef4444}
.pill.gray{background:rgba(100,116,139,.14);color:#64748b}
/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:26px;overflow-x:auto;scrollbar-width:none}
.tab{padding:11px 18px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13.5px;border:none;background:none;border-bottom:2.5px solid transparent;margin-bottom:-2px;font-family:inherit;white-space:nowrap;transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-color:var(--primary)}
/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius)}
.tbl{width:100%;border-collapse:collapse;min-width:600px}
.tbl th{font-size:12.5px;color:var(--muted);text-align:right;padding:13px 16px;border-bottom:1.5px solid var(--border);white-space:nowrap;background:var(--card-2)}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.15s}
.tbl tbody tr:hover{background:var(--card-2)}
/* ---------- Dashboard ---------- */
.dash{display:grid;grid-template-columns:255px 1fr;gap:24px;padding:30px 0;align-items:start}
.dash-side{padding:14px;position:sticky;top:calc(var(--hdr-h) + 16px)}
.d-side-user{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border);margin-bottom:10px}
.d-side-user .avatar{cursor:default}
.d-side-user b{font-size:14px;display:block;line-height:1.6}
.d-side-user span{font-size:11.5px;color:var(--muted)}
.d-link{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer;border:none;background:none;width:100%;font-family:inherit;text-align:right;transition:.15s;margin-bottom:2px}
.d-link:hover{background:var(--card-2);color:var(--text)}
.d-link.active{background:var(--primary-soft);color:var(--primary)}
.d-link .cnt{margin-inline-start:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{padding:20px;display:flex;gap:15px;align-items:center}
.stat-ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.stat-card b{font-size:19px;display:block;line-height:1.5}
.stat-card span{font-size:12.5px;color:var(--muted)}
.prog{height:8px;background:var(--border);border-radius:99px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));border-radius:99px;transition:width .4s}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .e-ic{width:72px;height:72px;border-radius:22px;background:var(--card-2);display:grid;place-items:center;margin:0 auto 16px;color:var(--muted)}
/* ---------- Shop layout ---------- */
.shop-layout{display:grid;grid-template-columns:262px 1fr;gap:24px;padding:30px 0;align-items:start}
.filter-card{padding:22px;position:sticky;top:calc(var(--hdr-h) + 16px)}
.filter-card h4{font-size:14px;margin-bottom:14px}
.f-group{margin-bottom:20px}
.f-group .chip{font-size:12.5px;padding:6px 13px}
.sortbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sortbar select{width:auto;padding:9px 14px;font-size:13px}
/* ---------- Course detail ---------- */
.detail-layout{display:grid;grid-template-columns:1fr 340px;gap:28px;padding:30px 0;align-items:start}
.buy-card{position:sticky;top:calc(var(--hdr-h) + 16px)}
.buy-card .b-thumb{height:160px;display:grid;place-items:center;color:#fff;font-size:40px;font-weight:900;border-radius:var(--radius) var(--radius) 0 0}
.buy-body{padding:22px}
.buy-body .price{font-size:22px}
.buy-list{list-style:none;margin:16px 0;font-size:13px;color:var(--muted)}
.buy-list li{display:flex;align-items:center;gap:9px;padding:6px 0}
.buy-list li svg{color:var(--success);flex-shrink:0}
.lesson-item{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;cursor:pointer;border:1.5px solid transparent;transition:.15s}
.lesson-item:hover{background:var(--card-2)}
.lesson-item.active{border-color:var(--primary);background:var(--primary-soft)}
.l-num{width:36px;height:36px;border-radius:11px;background:var(--card-2);display:grid;place-items:center;font-size:12.5px;font-weight:800;flex-shrink:0}
.lesson-item.active .l-num{background:var(--primary);color:#fff}
.l-tt{flex:1;min-width:0}
.l-tt b{font-size:13.5px;display:block;font-weight:600}
.l-tt span{font-size:11.5px;color:var(--muted)}
.l-st{flex-shrink:0;color:var(--muted)}
.l-st.done{color:var(--success)}
.review-item{border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.review-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.review-h i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
/* ---------- Learn ---------- */
.learn{display:grid;grid-template-columns:315px 1fr;gap:24px;padding:30px 0;align-items:start}
.learn-side{position:sticky;top:calc(var(--hdr-h) + 16px);max-height:calc(100vh - var(--hdr-h) - 40px);overflow:auto}
.learn-side-in{padding:14px}
.video-box{aspect-ratio:16/9;background:linear-gradient(135deg,#1e1b4b,#3730a3,#5b21b6);border-radius:var(--radius);display:grid;place-items:center;position:relative;color:#fff;overflow:hidden}
.video-box::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06);top:-100px;inset-inline-start:-80px}
.play-btn{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;cursor:pointer;transition:.25s;backdrop-filter:blur(4px)}
.play-btn:hover{transform:scale(1.1);background:rgba(255,255,255,.25)}
.file-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--border);border-radius:13px;margin-bottom:10px}
.file-row .f-ic{width:42px;height:42px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.file-row b{font-size:13.5px;display:block}
.file-row span{font-size:11.5px;color:var(--muted)}
.file-row .btn{margin-inline-start:auto}
/* ---------- Exam ---------- */
.q-card{padding:26px;margin-bottom:18px}
.q-card .q-no{display:inline-block;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:800;padding:4px 13px;border-radius:99px;margin-bottom:10px}
.q-card h3{font-size:15.5px;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:11px;padding:12px 15px;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;margin-top:10px;transition:.15s;font-size:14px}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft);font-weight:600}
.opt input{display:none}
.opt .o-mark{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);display:grid;place-items:center;flex-shrink:0;transition:.15s;color:#fff}
.opt.sel .o-mark{background:var(--primary);border-color:var(--primary)}
/* ---------- Certificate ---------- */
.cert{background:linear-gradient(135deg,#fffdf5,#fdf6e3);border:3px solid #d4a72c;border-radius:22px;padding:52px 44px;text-align:center;color:#1e293b;max-width:820px;margin:30px auto;position:relative;box-shadow:var(--shadow)}
.cert::before{content:'';position:absolute;inset:13px;border:1.5px dashed #d4a72c;border-radius:14px;pointer-events:none}
.cert .c-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;margin:0 auto 18px;color:#fff}
.cert h1{font-size:30px;font-weight:900;color:#92400e;margin-bottom:4px}
.cert .c-sub{color:#92700c;font-size:14px;letter-spacing:2px;margin-bottom:26px}
.cert .c-name{font-size:26px;font-weight:900;border-bottom:2px solid #d4a72c;display:inline-block;padding:0 34px 8px;margin:8px 0 18px}
.cert p{font-size:15px;color:#44403c}
.cert .c-grade{display:inline-block;background:#d4a72c;color:#fff;font-weight:800;padding:8px 26px;border-radius:99px;margin:16px 0 22px;font-size:15px}
.cert .c-foot{display:flex;justify-content:space-between;margin-top:34px;font-size:12.5px;color:#78716c}
.cert .c-foot b{display:block;color:#1e293b;font-size:13.5px}
/* ---------- Admin chart ---------- */
.chart{display:flex;align-items:flex-end;gap:14px;height:230px;padding-top:14px}
.chart .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:9px;height:100%}
.bar i{width:100%;max-width:48px;background:linear-gradient(180deg,var(--primary-2),var(--primary));border-radius:9px 9px 4px 4px;min-height:6px;transition:.3s;opacity:.9}
.bar:hover i{opacity:1}
.bar span{font-size:11.5px;color:var(--muted)}
.bar b{font-size:11.5px;color:var(--primary)}
/* ---------- Modal / toast ---------- */
.modal-root{position:fixed;inset:0;background:rgba(2,6,23,.62);backdrop-filter:blur(5px);z-index:110;display:none;place-items:center;padding:20px}
.modal-root.show{display:grid}
.modal{background:var(--card);border-radius:20px;max-width:530px;width:100%;padding:30px;position:relative;animation:pop .28s;max-height:90vh;overflow:auto;border:1px solid var(--border)}
.modal h3{font-size:18px;font-weight:900;margin-bottom:18px}
.m-close{position:absolute;top:16px;inset-inline-start:16px;width:36px;height:36px;border-radius:10px;border:none;background:var(--card-2);color:var(--muted);cursor:pointer;display:grid;place-items:center}
@keyframes pop{from{transform:scale(.93);opacity:0}}
.toasts{position:fixed;bottom:24px;inset-inline-start:24px;z-index:220;display:flex;flex-direction:column;gap:10px;max-width:min(360px,90vw)}
.toast{background:var(--card);border:1px solid var(--border);border-inline-start:4px solid var(--success);border-radius:13px;padding:13px 18px;box-shadow:var(--shadow);font-size:13.5px;font-weight:600;animation:slideIn .3s}
.toast.err{border-inline-start-color:var(--danger)}
.toast.warn{border-inline-start-color:var(--accent)}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}}
/* ---------- Misc ---------- */
.fade-up{animation:fadeUp .55s both}
.fade-up.d1{animation-delay:.08s}.fade-up.d2{animation-delay:.16s}.fade-up.d3{animation-delay:.24s}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}}
.notif-item{display:flex;gap:13px;padding:15px;border:1px solid var(--border);border-radius:14px;margin-bottom:11px;transition:.2s}
.notif-item.unread{border-inline-start:4px solid var(--primary);background:var(--primary-soft)}
.notif-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.notif-item b{font-size:13.5px;display:block}
.notif-item p{font-size:12.5px;color:var(--muted)}
.notif-item time{font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mt1{margin-top:10px}.mt2{margin-top:20px}.mt3{margin-top:30px}
.mb1{margin-bottom:10px}.mb2{margin-bottom:20px}.mb3{margin-bottom:30px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.divider{height:1px;background:var(--border);margin:22px 0;border:none}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- Responsive ---------- */
@media(max-width:1024px){
  .hero-in,.detail-layout{grid-template-columns:1fr}
  .hero-visual{display:none}
  .dash,.learn,.shop-layout{grid-template-columns:1fr}
  .dash-side,.filter-card,.learn-side,.buy-card{position:static}
  .learn-side{max-height:none}
  .buy-card{order:-1}
  .ftr-in{grid-template-columns:1fr 1fr}
}
@media(max-width:880px){
  .nav{position:fixed;top:var(--hdr-h);inset-inline:0;background:var(--card);flex-direction:column;padding:14px 20px 20px;display:none;border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:55}
  .nav.open{display:flex}
  .nav a{padding:12px 14px;font-size:15px}
  .hdr-burger{display:grid}
  .searchbox{display:none}
  .hero h1{font-size:30px}
  .cta-form{min-width:100%}
}
@media(max-width:640px){
  .ftr-in{grid-template-columns:1fr}
  .sec{padding:52px 0}
  .hero{padding:60px 0}
  .hero-stats{gap:24px}
  .cert{padding:34px 20px}
  .cert h1{font-size:22px}
  .cert .c-name{font-size:19px}
}
@media print{
  body *{visibility:hidden}
  .cert,.cert *{visibility:visible}
  .cert{position:fixed;top:0;inset-inline:0;margin:0}
}

/* ---------- Toast & Modal ---------- */
function toast(msg,type){
  const t=document.createElement('div');
  t.className='toast'+(type==='err'?' err':type==='warn'?' warn':'');
  t.textContent=msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.4s';setTimeout(()=>t.remove(),400)},3200);
}

}

<script>
/* ==================== DATABASE (localStorage) ==================== */
const DB_KEY='zoomacademy_db_v1';
let db=null;
function defaultDB(){

      {id:'ORD-58203',userId:'u4',items:[{type:'product',id:'p2',title:PRODUCTS[1].title,price:PRODUCTS[1].price,qty:2}],sub:PRODUCTS[1].price*2,discount:0,total:PRODUCTS[1].price*2,gateway:'zarinpal',ref:'ZP-991122',status:'در حال پردازش',date:Date.now()-86400000*2}
    ],
    notifs:{
      u_demo:[{id:uid('n'),title:'به آکادمی زوم خوش آمدید',text:'حساب کاربری شما با موفقیت ایجاد شد. اولین دوره خود را انتخاب کنید!',date:Date.now()-86400000*30,read:true},

      c1:[{name:'محمد اکبری',rating:5,text:'بهترین دوره جاوااسکریپتی که دیدم. پروژه‌ها کاربردی و به‌روز بودن.'},{name:'فاطمه کریمی',rating:5,text:'مدرس خیلی روان توضیح می‌ده و پشتیبانی هم عالیه.'}],
      c2:[{name:'علی رضایی',rating:5,text:'برای شروع طراحی وب بی‌نظیره؛ من از صفر شروع کردم و الان سایت خودم رو ساختم.'}],

function loadDB(){
  try{db=JSON.parse(localStorage.getItem(DB_KEY));}catch(e){db=null}
  if(!db||!db.users){db=defaultDB();saveDB();}
}
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
/* ---------- Session ---------- */
function getSessionUid(){return localStorage.getItem('zoomacademy_session')}
function currentUser(){const id=getSessionUid();return db.users.find(u=>u.id===id)||null}
function isEnrolled(cid){const u=currentUser();if(!u)return false;return (db.enrolls[u.id]||[]).some(e=>e.courseId===cid)}
function getEnroll(cid){const u=currentUser();if(!u)return null;return (db.enrolls[u.id]||[]).find(e=>e.courseId===cid)||null}
function courseById(id){return COURSES.find(c=>c.id===id)}
function productById(id){return PRODUCTS.find(p=>p.id===id)}
function teacherById(id){return TEACHERS.find(t=>t.id===id)}
function teacherName(tid){const t=teacherById(tid);return t?t.name:'—'}
/* ---------- Notifications ---------- */
function pushNotif(userId,title,text){
  if(!db.notifs[userId])db.notifs[userId]=[];
  db.notifs[userId].unshift({id:uid('n'),title,text,date:Date.now(),read:false});
  saveDB();
}
function unreadCount(){const u=currentUser();if(!u)return 0;return (db.notifs[u.id]||[]).filter(n=>!n.read).length}
/* ---------- Cart ---------- */
function cartKey(){return getSessionUid()||'guest'}
function cartItems(){const c=db.carts[cartKey()]||[];return c.filter(it=>it.type==='course'?courseById(it.id):productById(it.id))}
function cartCount(){return cartItems().reduce((s,i)=>s+i.qty,0)}
function cartSub(){return cartItems().reduce((s,i)=>{const p=i.type==='course'?courseById(i.id).price:productById(i.id).price;return s+p*i.qty},0)}
function addToCart(type,id){
  const item=type==='course'?courseById(id):productById(id);
  if(!item)return;
  if(type==='course'&&isEnrolled(id)){toast('شما قبلاً در این دوره ثبت‌نام کرده‌اید','warn');return}
  if(!db.carts[cartKey()])db.carts[cartKey()]=[];
  const ex=db.carts[cartKey()].find(i=>i.type===type&&i.id===id);
  if(ex){toast('این مورد قبلاً به سبد خرید اضافه شده است','warn')}
  else{db.carts[cartKey()].push({type,id,qty:1});saveDB();toast('به سبد خرید اضافه شد');renderHeader();updateCartBadges()}
}
function removeFromCart(type,id){db.carts[cartKey()]=(db.carts[cartKey()]||[]).filter(i=>!(i.type===type&&i.id===id));saveDB();renderHeader();if(location.hash.includes('cart'))router()}
/* ---------- Wishlist ---------- */
function wishList(){return db.wishes[cartKey()]||[]}
function inWish(type,id){return wishList().some(w=>w.type===type&&w.id===id)}
function toggleWish(type,id,ev){
  if(ev)ev.stopPropagation();
  if(!db.wishes[cartKey()])db.wishes[cartKey()]=[];
  const arr=db.wishes[cartKey()];
  const idx=arr.findIndex(w=>w.type===type&&w.id===id);
  if(idx>-1){arr.splice(idx,1);toast('از علاقه‌مندی‌ها حذف شد','warn')}
  else{arr.push({type,id});toast('به علاقه‌مندی‌ها اضافه شد')}
  saveDB();router();
}
/* ---------- Theme ---------- */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);document.body.setAttribute('data-theme',t);localStorage.setItem('zoomacademy_theme',t);const b=$('#themeBtn');if(b)b.innerHTML=t==='dark'?I.sun:I.moon}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')}
/* ---------- Header ---------- */
function renderHeader(){
  const u=currentUser();
  const h=location.hash||'#/home';
  const link=(href,label)=>'<a href="'+href+'" class="'+(h.startsWith(href)?'active':'')+'">'+label+'</a>';
  $('#hdr').innerHTML=
  '<div class="container hdr-in">'+
    '<a class="logo" href="#/home"><span class="logo-ic">'+I.zap+'</span>آکادمی <b>زوم</b></a>'+
    '<nav class="nav" id="mainNav">'+
      link('#/home','صفحه اصلی')+link('#/courses','دوره‌ها')+link('#/shop','فروشگاه')+link('#/blog','وبلاگ')+
    '</nav>'+
    '<div class="hdr-actions">'+
      '<div class="searchbox">'+I.search+'<input id="hdrSearch" placeholder="جستجوی دوره، محصول، مدرس..." onkeydown="if(event.key===\'Enter\')globalSearch(this.value)"></div>'+
      '<button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="تغییر تم">'+(document.documentElement.getAttribute('data-theme')==='dark'?I.sun:I.moon)+'</button>'+
      '<a class="icon-btn" href="#/cart" title="سبد خرید">'+I.cart+(cartCount()?'<span class="badge-dot">'+fmt(cartCount())+'</span>':'')+'</a>'+
      (u?
        '<div class="user-wrap"><button class="avatar" onclick="toggleDrop()">'+esc(initials(u.name))+'</button>'+
        '<div class="user-drop" id="userDrop">'+
          '<div style="padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px"><b style="font-size:14px">'+esc(u.name)+'</b><div class="small muted">'+esc(u.email)+'</div></div>'+
          '<a href="#/dashboard/overview">'+I.grid+'داشبورد من</a>'+
          (u.role==='admin'?'<a href="#/admin/stats">'+I.shield+'پنل مدیریت</a>':'')+
          (u.role==='instructor'||u.role==='admin'?'<a href="#/instructor/overview">'+I.book+'پنل مدرس</a>':'')+
          '<a href="#/dashboard/profile">'+I.settings+'تنظیمات پروفایل</a>'+
          '<button onclick="logout()" style="color:var(--danger)">'+I.x+'خروج از حساب</button>'+
        '</div></div>'
      :
        '<a class="btn btn-soft btn-sm" href="#/login">ورود</a><a class="btn btn-primary btn-sm" href="#/register">ثبت‌نام</a>'
      )+
      '<button class="icon-btn hdr-burger" onclick="document.getElementById(\'mainNav\').classList.toggle(\'open\')">'+I.menu+'</button>'+
    '</div>'+
  '</div>';
}
function toggleDrop(){const d=$('#userDrop');if(d)d.classList.toggle('open')}
document.addEventListener('click',e=>{
  const w=e.target.closest('.user-wrap');
  if(!w){const d=$('#userDrop');if(d)d.classList.remove('open')}
});
function logout(){
  localStorage.removeItem('zoomacademy_session');
  toast('با موفقیت خارج شدید');
  go('#/home');renderHeader();router();

/* ---------- Router ---------- */
window.addEventListener('hashchange',router);
function router(){
  const raw=(location.hash||'#/home').replace(/^#\/?/,'');
  const parts=raw.split('/').map(decodeURIComponent);
  const page=parts[0]||'home';
  const app=$('#app');
  const u=currentUser();
  window.scrollTo(0,0);
  renderHeader();
  if(!u&&['dashboard','learn','exam','checkout'].includes(page)){toast('برای دسترسی ابتدا وارد حساب شوید','warn');app.innerHTML=pageLogin();return}
  let html='';
  switch(page){
    case 'home':html=pageHome();break;
    case 'courses':html=pageCourses(parts[1]);break;
    case 'course':html=pageCourse(parts[1]);break;
    case 'shop':html=pageShop(parts[1]);break;
    case 'product':html=pageProduct(parts[1]);break;
    case 'cart':html=pageCart();break;
    case 'checkout':html=pageCheckout();break;
    case 'order-success':html=pageOrderSuccess(parts[1]);break;
    case 'login':html=pageLogin();break;
    case 'register':html=pageRegister();break;
    case 'forgot':html=pageForgot();break;
    case 'dashboard':html=pageDashboard(parts[1]||'overview');break;
    case 'learn':html=pageLearn(parts[1],parts[2]);break;
    case 'exam':html=pageExam(parts[1]);break;
    case 'cert':html=pageCert(parts[1]);break;
    case 'instructor':html=pageInstructor(parts[1]||'overview');break;
    case 'admin':html=pageAdmin(parts[1]||'stats');break;
    case 'search':html=pageSearch(parts.slice(1).join('/')||'');break;
    case 'blog':html=pageBlog();break;
    case 'blogpost':html=pageBlogPost(parts[1]);break;
    default:html=pageHome();
  }
  app.innerHTML=html;
  if(page==='home')runCounters();
}

function runCounters(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target=+el.getAttribute('data-count');let cur=0;
    const step=Math.max(1,Math.ceil(target/60));
    const t=setInterval(()=>{cur+=step;if(cur>=target){cur=target;clearInterval(t)}el.textContent=fmt(cur)},22);
  });
}

      items:cartItems().map(it=>{const p=it.type==='course'?courseById(it.id):productById(it.id);return {type:it.type,id:p.id,title:p.title,price:p.price,qty:it.qty}}),
      sub,discount:dc?sub-Math.round(sub*dc.pct/100):0,
      total,gateway:gwName,ref:(gw.value==='zarinpal'?'ZP-':'ID-')+Math.floor(100000+Math.random()*899999),
      status:'در حال پردازش',date:Date.now()
    };
    db.orders.unshift(order);
    /* enroll courses + unlock digital */
    order.items.forEach(it=>{
      if(it.type==='course'){
        if(!db.enrolls[u.id])db.enrolls[u.id]=[];
        if(!db.enrolls[u.id].some(e=>e.courseId===it.id))db.enrolls[u.id].push({courseId:it.id,done:[],exam:null,issued:Date.now()});
      }
    });
    if(db.carts[u.id])db.carts[u.id]=[];
    localStorage.removeItem('zoomacademy_dc');
    pushNotif(u.id,'پرداخت موفق','سفارش '+order.id+' با موفقیت پرداخت شد'+(order.items.some(i=>i.type==='course')?' و دوره‌ها به حساب شما اضافه شدند.':'.'));
    saveDB();renderHeader();
    go('#/order-success/'+order.id);
  },1200);
}

  return authShell(

    '<div class="auth-alt">حساب ندارید؟ <a href="#/register">ثبت‌نام رایگان</a></div>'+
    '<div class="demo-box"><b>حساب‌های نمایشی:</b><br>مدیر: admin@site.ir / 123456<br>مدرس: teacher@site.ir / 123456<br>دانشجو: user@site.ir / 123456</div>');
}
function doLogin(){
  const email=$('#lgEmail').value.trim().toLowerCase();
  const pass=$('#lgPass').value;
  const u=db.users.find(x=>x.email.toLowerCase()===email&&x.pass===pass);
  if(!u){toast('ایمیل یا رمز عبور اشتباه است','err');return}
  /* merge guest cart */
  if(!getSessionUid()&&db.carts['guest']){
    db.carts[u.id]=db.carts[u.id]||[];
    db.carts['guest'].forEach(g=>{if(!db.carts[u.id].some(x=>x.type===g.type&&x.id===g.id))db.carts[u.id].push(g)});
    if(db.wishes&&db.wishes['guest']){db.wishes[u.id]=db.wishes[u.id]||[];db.wishes['guest'].forEach(w=>{if(!db.wishes[u.id].some(x=>x.type===w.type&&x.id===w.id))db.wishes[u.id].push(w)});delete db.wishes['guest']}
    delete db.carts['guest'];
  }
  localStorage.setItem('zoomacademy_session',u.id);
  saveDB();
  toast('خوش آمدید، '+u.name+'!');
  go(u.role==='admin'?'#/admin/stats':'#/dashboard/overview');
}
function pageRegister(){
  return authShell(
    '<h1>ایجاد حساب جدید</h1><p class="sub">در کمتر از یک دقیقه عضو آکادمی زوم شوید.</p>'+
    '<div class="field"><label>نام و نام خانوادگی</label><input id="rgName" class="input" placeholder="مثلاً علی محمدی"></div>'+
    '<div class="field"><label>ایمیل</label><input id="rgEmail" class="input" type="email" placeholder="you@example.com" dir="ltr"></div>'+
    '<div class="field"><label>رمز عبور (حداقل ۶ کاراکتر)</label><input id="rgPass" class="input" type="password" placeholder="••••••" dir="ltr"></div>'+
    '<button class="btn btn-primary btn-block btn-lg" onclick="doRegister()">ثبت‌نام</button>'+
    '<div class="auth-alt">قبلاً ثبت‌نام کرده‌اید؟ <a href="#/login">ورود</a></div>');
}
function doRegister(){
  const name=$('#rgName').value.trim();
  const email=$('#rgEmail').value.trim().toLowerCase();
  const pass=$('#rgPass').value;
  if(!name||name.length<3){toast('نام خود را کامل وارد کنید','warn');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('ایمیل معتبر وارد کنید','warn');return}
  if(pass.length<6){toast('رمز عبور باید حداقل ۶ کاراکتر باشد','warn');return}
  if(db.users.some(u=>u.email.toLowerCase()===email)){toast('این ایمیل قبلاً ثبت شده است','err');return}
  const u={id:uid('u'),name,email,pass,role:'student',joined:Date.now()};
  db.users.push(u);
  localStorage.setItem('zoomacademy_session',u.id);
  pushNotif(u.id,'خوش آمدید!','حساب شما با موفقیت ساخته شد. با کد تخفیف WELCOME اولین خرید خود را با ۱۰٪ ارزان‌تر انجام دهید.');
  saveDB();
  toast('ثبت‌نام موفق! خوش آمدید');
  go('#/dashboard/overview');
}
function pageForgot(){
  return authShell(
    '<h1>بازیابی رمز عبور</h1><p class="sub">ایمیل حساب خود را وارد کنید تا لینک بازیابی برایتان ارسال شود.</p>'+
    '<div class="field"><label>ایمیل</label><input id="fgEmail" class="input" type="email" placeholder="you@example.com" dir="ltr"></div>'+
    '<button class="btn btn-primary btn-block btn-lg" onclick="doForgot()">ارسال لینک بازیابی</button>'+

}

  const email=$('#fgEmail').value.trim().toLowerCase();
  if(!email){toast('ایمیل را وارد کنید','warn');return}
  toast(db.users.some(u=>u.email.toLowerCase()===email)?'لینک بازیابی به ایمیل شما ارسال شد':'اگر این ایمیل ثبت شده باشد، لینک برایتان ارسال می‌شود');
}

<script>

function myCerts(){
  const u=currentUser();if(!u)return [];
  const list=[];
  (db.enrolls[u.id]||[]).forEach(e=>{
    const c=courseById(e.courseId);if(!c)return;
    const done=e.done.length>=c.lessons.length;
    const passed=e.exam!==null&&e.exam>=70;
    if(done||passed)list.push({courseId:c.id,grade:e.exam!==null?e.exam:100,issued:e.issued});
  });
  return list;
}
function pageDashboard(tab){
  const u=currentUser();
  switch(tab){
    case 'courses':return dashCourses();
    case 'certs':return dashCerts();
    case 'orders':return dashOrders();
    case 'wishlist':return dashWishlist();
    case 'notifs':return dashNotifs();
    case 'profile':return dashProfile();
    default:return dashOverview();
  }
}

  (inProg.length?inProg.map(e=>{const c=courseById(e.courseId);const pct=Math.round(e.done.length/c.lessons.length*100);
    return '<div class="lesson-item" onclick="go(\'#/learn/'+c.id+'\')"><span class="l-num" style="background:linear-gradient(135deg,'+c.c1+','+c.c2+');color:#fff">'+c.letter+'</span>'+
    '<span class="l-tt"><b>'+esc(c.title)+'</b><span>'+fmt(e.done.length)+' از '+fmt(c.lessons.length)+' درس — '+fmt(pct)+'٪</span>'+
    '<div class="prog mt1" style="height:5px"><i style="width:'+pct+'%"></i></div></span>'+

  '<div class="card" style="padding:26px;max-width:560px">'+
    '<div class="row mb3"><span class="avatar" style="width:64px;height:64px;font-size:22px;border-radius:18px">'+esc(initials(u.name))+'</span><div><b>'+esc(u.name)+'</b><div class="small muted">'+esc(u.email)+'</div></div></div>'+
    '<div class="field"><label>نام و نام خانوادگی</label><input id="pfName" class="input" value="'+esc(u.name)+'"></div>'+
    '<div class="field"><label>ایمیل (غیرقابل تغییر)</label><input class="input" value="'+esc(u.email)+'" disabled dir="ltr"></div>'+
    '<div class="field"><label>رمز عبور جدید (در صورت تمایل)</label><input id="pfPass" class="input" type="password" placeholder="••••••" dir="ltr"></div>'+

  '</div>'+
  '<div class="card" style="padding:22px;margin-top:18px;max-width:560px"><b class="small">اطلاعات حساب</b>'+

  '<div class="row between mt1 small"><span class="muted">تاریخ عضویت</span><span>'+faDate(u.joined)+'</span></div></div>');
}
function saveProfile(){
  const u=currentUser();
  const name=$('#pfName').value.trim();
  const pass=$('#pfPass').value;
  if(name&&name.length>=3)u.name=name;
  if(pass){if(pass.length<6){toast('رمز عبور باید حداقل ۶ کاراکتر باشد','warn');return}u.pass=pass}
  saveDB();toast('پروفایل با موفقیت به‌روزرسانی شد');renderHeader();router();
}
/* ==================== LEARN ==================== */
function pageLearn(cid,idxStr){
  const c=courseById(cid);
  if(!c)return notFound();
  if(!isEnrolled(cid)){toast('ابتدا دوره را خریداری کنید','warn');go('#/course/'+cid);return ''}
  const en=getEnroll(cid);
  let idx=Math.min(Math.max(0,parseInt(idxStr||en._last||'0',10)||0),c.lessons.length-1);
  en._last=idx;saveDB();
  const lesson=c.lessons[idx];
  const done=en.done.includes(idx);
  const allDone=en.done.length>=c.lessons.length;
  const pct=Math.round(en.done.length/c.lessons.length*100);
  return pageHead(esc(c.title),['دوره‌های من','حالت یادگیری'])+
  '<div class="container"><div class="learn">'+
    '<div class="card learn-side"><div class="learn-side-in">'+
      '<div style="padding:8px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:10px">'+
        '<b style="font-size:14px;display:block">'+esc(c.title)+'</b>'+
        '<span class="small muted">پیشرفت: '+fmt(pct)+'٪ ('+fmt(en.done.length)+' از '+fmt(c.lessons.length)+')</span>'+
        '<div class="prog mt1" style="height:6px"><i style="width:'+pct+'%"></i></div></div>'+
      c.lessons.map((l,i)=>'<div class="lesson-item '+(i===idx?'active':'')+'" onclick="go(\'#/learn/'+cid+'/'+i+'\')">'+
        '<span class="l-num">'+(en.done.includes(i)?I.check:fmt(i+1))+'</span>'+
        '<span class="l-tt"><b>'+esc(l.t)+'</b><span>'+esc(l.d)+'</span></span>'+
        '<span class="l-st '+(en.done.includes(i)?'done':'')+'">'+(en.done.includes(i)?I.check:(i===0||en.done.includes(i-1)||en.done.length?I.play:I.lock))+'</span></div>').join('')+
    '</div></div>'+
    '<div>'+
      '<div class="video-box">'+
        '<div style="text-align:center;position:relative;z-index:1"><div class="play-btn" style="margin:0 auto 16px" onclick="toast(\'پخش ویدیو در حالت نمایشی غیرفعال است\')">'+I.play+'</div>'+
        '<b style="font-size:17px">درس '+fmt(idx+1)+': '+esc(lesson.t)+'</b><p class="small" style="color:rgba(255,255,255,.75);margin-top:4px">مدت: '+esc(lesson.d)+'</p></div></div>'+
      '<div class="card" style="padding:24px;margin-top:20px">'+
        '<div class="row between"><h3 style="font-size:17px">'+esc(lesson.t)+'</h3>'+
        '<div class="row" style="gap:8px">'+
          (idx>0?'<button class="btn btn-outline btn-sm" onclick="go(\'#/learn/'+cid+'/'+(idx-1)+'\')">درس قبلی</button>':'')+
          (idx<c.lessons.length-1?'<button class="btn btn-outline btn-sm" onclick="go(\'#/learn/'+cid+'/'+(idx+1)+'\')">درس بعدی</button>':'')+
        '</div></div>'+
        '<p class="small muted mt1">در این بخش، مفاهیم '+esc(lesson.t)+' به صورت گام‌به‌گام و با مثال‌های عملی تدریس می‌شود. پس از تماشای ویدیو، تمرین مربوطه را انجام دهید و سپس درس را به عنوان تکمیل‌شده علامت بزنید.</p>'+
        '<button class="btn '+(done?'btn-success':'btn-primary')+' mt2" onclick="markDone(\''+cid+'\','+idx+')">'+(done?I.check+' درس تکمیل شد':'علامت‌گذاری به عنوان تکمیل‌شده')+'</button>'+
      '</div>'+
      '<div class="card" style="padding:24px;margin-top:18px"><h3 style="font-size:16px;margin-bottom:14px">فایل‌های پیوست دوره</h3>'+
        c.files.map(f=>'<div class="file-row"><span class="f-ic">'+I.file+'</span><div><b>'+esc(f.n)+'</b><span>حجم: '+esc(f.s)+'</span></div><button class="btn btn-soft btn-sm" onclick="toast(\'دانلود «'+esc(f.n)+'» آغاز شد\')">'+I.download+' دانلود</button></div>').join('')+'</div>'+
      (allDone?'<div class="card" style="padding:24px;margin-top:18px;border:2px solid var(--success)"><div class="row between"><div><h3 style="font-size:16px;color:var(--success)">تبریک! دوره را کامل کردید</h3><p class="small muted">برای دریافت گواهینامه در آزمون پایان دوره شرکت کنید'+(en.exam!==null&&en.exam>=70?' یا گواهینامه خود را مشاهده کنید':'')+'.</p></div>'+
        (en.exam!==null&&en.exam>=70?'<a class="btn btn-success" href="#/cert/'+cid+'">'+I.award+' گواهینامه من</a>':'<a class="btn btn-primary" href="#/exam/'+cid+'">'+I.edit+' شرکت در آزمون</a>')+'</div></div>':'')+
    '</div></div></div>';
}
function markDone(cid,idx){
  const en=getEnroll(cid);if(!en)return;
  const c=courseById(cid);
  if(!en.done.includes(idx)){
    en.done.push(idx);
    if(en.done.length>=c.lessons.length){
      pushNotif(currentUser().id,'نتیجه آزمون'.replace('نتیجه آزمون','دوره تکمیل شد'),'شما دوره «'+c.title+'» را با موفقیت به پایان رساندید. برای دریافت گواهینامه در آزمون شرکت کنید.');
      toast('دوره تکمیل شد! آماده آزمون هستید');
    } else toast('درس با موفقیت ثبت شد');
    saveDB();
  }
  router();
}
/* ==================== EXAM ==================== */
function pageExam(cid){
  const c=courseById(cid);
  if(!c)return notFound();
  if(!isEnrolled(cid)){go('#/course/'+cid);return ''}
  const en=getEnroll(cid);
  return pageHead('آزمون پایان دوره: '+esc(c.title),[esc(c.title),'آزمون'])+
  '<div class="container" style="padding:30px 20px;max-width:820px">'+
    '<div class="card" style="padding:26px;margin-bottom:20px">'+
      '<div class="row between"><div><h2 style="font-size:19px">آزمون «'+esc(c.title)+'»</h2><p class="small muted mt1">'+fmt(c.exam.length)+' سؤال چهارگزینه‌ای — حداقل نمره قبولی: ۷۰ از ۱۰۰'+(en.exam!==null?' — بهترین نمره شما: <b style="color:var(--primary)">'+fmt(en.exam)+'</b>':'')+'</p></div>'+
      '<span class="stat-ic" style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">'+I.edit+'</span></div></div>'+
    c.exam.map((q,i)=>'<div class="card q-card"><span class="q-no">سؤال '+fmt(i+1)+'</span><h3>'+esc(q.q)+'</h3>'+
      q.o.map((op,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'" onchange="this.closest(\'.q-card\').querySelectorAll(\'.opt\').forEach(o=>o.classList.remove(\'sel\'));this.closest(\'.opt\').classList.add(\'sel\')"><span class="o-mark">'+I.check+'</span><span>'+esc(op)+'</span></label>').join('')+'</div>').join('')+
    '<button class="btn btn-primary btn-block btn-lg" onclick="submitExam(\''+cid+'\')">پایان آزمون و مشاهده نتیجه</button></div>';
}
function submitExam(cid){
  const c=courseById(cid);
  const en=getEnroll(cid);
  let correct=0,answered=0;
  c.exam.forEach((q,i)=>{
    const sel=document.querySelector('input[name=q'+i+']:checked');
    if(sel){answered++;if(+sel.value===q.a)correct++}
  });
  if(answered<c.exam.length){toast('به همه سؤال‌ها پاسخ دهید ('+fmt(answered)+' از '+fmt(c.exam.length)+')','warn');return}
  const score=Math.round(correct/c.exam.length*100);
  const passed=score>=70;
  if(en.exam===null||score>en.exam)en.exam=score;
  pushNotif(currentUser().id,'نتیجه آزمون','نتیجه آزمون دوره «'+c.title+'»: '+fmt(score)+' از ۱۰۰ — '+(passed?'قبول شدید! گواهینامه شما صادر شد.':'متأسفانه قبول نشدید؛ دوباره تلاش کنید.'));
  saveDB();
  openModal('<div style="text-align:center;padding:10px 0">'+
    '<div style="width:84px;height:84px;border-radius:50%;background:'+(passed?'rgba(16,185,129,.14)':'rgba(239,68,68,.14)')+';color:'+(passed?'var(--success)':'var(--danger)')+';display:grid;place-items:center;margin:0 auto 16px">'+(passed?I.check:I.x)+'</div>'+
    '<h2 style="font-size:22px;font-weight:900">'+(passed?'قبول شدید!':'قبول نشدید')+'</h2>'+
    '<p class="mt1">نمره شما: <b style="font-size:20px;color:var(--primary)">'+fmt(score)+' از ۱۰۰</b></p>'+
    '<p class="small muted">'+fmt(correct)+' پاسخ صحیح از '+fmt(c.exam.length)+' سؤال</p>'+
    (passed?'<p class="small mt1" style="color:var(--success);font-weight:700">گواهینامه پایان دوره برای شما صادر شد.</p><a class="btn btn-success btn-block mt2" href="#/cert/'+cid+'" onclick="closeModal()">'+I.award+' مشاهده گواهینامه</a>':'<p class="small mt1">می‌توانید دوباره در آزمون شرکت کنید.</p><a class="btn btn-primary btn-block mt2" href="#/learn/'+cid+'" onclick="closeModal()">مرور مجدد دوره</a>')+
    '</div>');
}
/* ==================== CERTIFICATE ==================== */
function pageCert(cid){
  const c=courseById(cid);
  if(!c)return notFound();
  if(!isEnrolled(cid)){go('#/course/'+cid);return ''}
  if(!canCert(c)){toast('برای دریافت گواهینامه ابتدا دوره را کامل کنید یا در آزمون قبول شوید','warn');go('#/exam/'+cid);return ''}
  const en=getEnroll(cid);
  const u=currentUser();
  const grade=en.exam!==null?en.exam:100;
  const certNo='ZA-'+cid.toUpperCase()+'-'+u.id.toUpperCase();
  return '<div class="container" style="padding:40px 20px">'+
    '<div class="row between mb1" style="max-width:820px;margin:0 auto 10px"><h1 style="font-size:20px">گواهینامه پایان دوره</h1><button class="btn btn-primary btn-sm" onclick="window.print()">'+I.download+' چاپ / ذخیره PDF</button></div>'+
    '<div class="cert">'+
      '<div class="c-logo">'+I.zap+'</div>'+
      '<h1>گواهینامه رسمی</h1><div class="c-sub">CERTIFICATE OF COMPLETION — آکادمی زوم</div>'+
      '<p>بدین‌وسیله تأیید می‌شود که</p><div class="c-name">'+esc(u.name)+'</div>'+
      '<p>دوره تخصصی</p><h2 style="font-size:20px;font-weight:900;color:#92400e;margin:6px 0 14px">«'+esc(c.title)+'»</h2>'+
      '<p>را با موفقیت و نمره نهایی زیر به پایان رسانده است</p>'+
      '<div class="c-grade">نمره: '+fmt(grade)+' از ۱۰۰</div>'+
      '<div class="c-foot"><div><b>تاریخ صدور</b>'+faDate(en.issued||Date.now())+'</div><div><b>شماره گواهینامه</b><span dir="ltr">'+certNo+'</span></div><div><b>مدرس دوره</b>'+esc(teacherName(c.tid))+'</div></div>'+
    '</div></div>';
}
</script>
<script>
/* ==================== INSTRUCTOR PANEL ==================== */
function myCourses(){
  const u=currentUser();
  if(u.role==='admin')return COURSES;
  const t=TEACHERS.find(x=>x.name===u.name);
  return COURSES.filter(c=>c.tid===(t?t.id:'__none__'));
}
function pageInstructor(tab){
  const u=currentUser();
  if(u.role==='student'){toast('دسترسی فقط برای مدرس‌ها مجاز است','warn');go('#/dashboard/overview');return ''}
  const my=myCourses();
  const myIds=my.map(c=>c.id);
  let html='';
  if(tab==='courses')html=insCourses(my);
  else if(tab==='students')html=insStudents(myIds);
  else if(tab==='income')html=insIncome(myIds);
  else html=insOverview(my);
  return '<div class="container"><div class="dash">'+
    '<div class="card dash-side">'+
      '<div class="d-side-user"><span class="avatar">'+esc(initials(u.name))+'</span><div><b>'+esc(u.name)+'</b><span>پنل مدرس</span></div></div>'+
      dLink('overview',I.grid,'نمای کلی',tab)+dLink('courses',I.book,'دوره‌های من',tab)+dLink('students',I.users,'دانشجویان',tab)+dLink('income',I.credit,'درآمد',tab)+
      '<button class="d-link" onclick="go(\'#/home\')">'+I.home+'بازگشت به سایت</button>'+
    '</div><div>'+html+'</div></div></div>';
}
function dLink(t,ic,label,tab){return '<button class="d-link '+(tab===t?'active':'')+'" onclick="go(\'#/instructor/'+t+'\')">'+ic+label+'</button>'}
function insOverview(my){
  const myIds=my.map(c=>c.id);
  const students=(()=>{const s=new Set();myIds.forEach(cid=>{Object.keys(db.enrolls).forEach(uidKey=>{if(db.enrolls[uidKey].some(e=>e.courseId===cid))s.add(uidKey)})});return s.size})();
  const income=ordersIncome(myIds);
  return '<h1 style="font-size:21px;margin-bottom:22px">پنل مدرس</h1>'+
  '<div class="stat-cards">'+
    statCard(I.book,'linear-gradient(135deg,#6366f1,#8b5cf6)',fmt(my.length),'دوره فعال')+
    statCard(I.users,'linear-gradient(135deg,#0ea5e9,#2563eb)',fmt(students),'دانشجوی شما')+
    statCard(I.credit,'linear-gradient(135deg,#10b981,#059669)',money(income),'درآمد کل (۷۰٪ سهم)')+
    statCard(I.award,'linear-gradient(135deg,#f59e0b,#f97316)',fmt(Math.round(my.reduce((s,c)=>s+c.rating,0)/(my.length||1)*10)/10),'میانگین امتیاز')+
  '</div>'+
  '<div class="card" style="padding:24px"><h3 style="font-size:16px;margin-bottom:14px">عملکرد دوره‌های شما</h3>'+
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>دوره</th><th>دانشجو</th><th>امتیاز</th><th>قیمت</th><th>درآمد تخمینی</th></tr></thead><tbody>'+
  my.map(c=>{const n=enrollCount(c.id);return '<tr><td><b class="small">'+esc(c.title)+'</b></td><td>'+fmt(n)+'</td><td>'+fmt(c.rating)+'</td><td>'+money(c.price)+'</td><td style="color:var(--success);font-weight:700">'+money(Math.round(n*c.price*0.7))+'</td></tr>'}).join('')+
  '</tbody></table></div></div>';
}
function enrollCount(cid){return Object.keys(db.enrolls).filter(k=>db.enrolls[k].some(e=>e.courseId===cid)).length}
function ordersIncome(myIds){
  let sum=0;
  db.orders.forEach(o=>o.items.forEach(it=>{if(it.type==='course'&&myIds.includes(it.id))sum+=Math.round(it.price*it.qty*0.7)}));
  return sum;
}
function insCourses(my){
  return '<div class="row between mb2"><h1 style="font-size:21px">دوره‌های من</h1><button class="btn btn-primary" onclick="openAddCourse()">'+I.plus+' افزودن دوره جدید</button></div>'+
  '<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>دوره</th><th>دسته</th><th>قیمت</th><th>درس‌ها</th><th>دانشجو</th><th>وضعیت</th></tr></thead><tbody>'+
  my.map(c=>'<tr><td><b class="small">'+esc(c.title)+'</b></td><td class="small">'+c.cat+'</td><td>'+money(c.price)+'</td><td>'+fmt(c.lessons.length)+'</td><td>'+fmt(enrollCount(c.id))+'</td><td><span class="pill green">فعال</span></td></tr>').join('')+
  '</tbody></table></div>';
}
function openAddCourse(){
  openModal('<h3>ایجاد دوره جدید</h3>'+
    '<div class="field"><label>عنوان دوره</label><input id="ncTitle" class="input" placeholder="مثلاً دوره مقدماتی Node.js"></div>'+
    '<div class="field"><label>دسته‌بندی</label><select id="ncCat" class="input">'+CATS_C.map(c=>'<option>'+c+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>سطح</label><select id="ncLevel" class="input"><option>مقدماتی</option><option>متوسط</option><option>پیشرفته</option></select></div>'+
    '<div class="field"><label>قیمت (تومان)</label><input id="ncPrice" class="input" type="number" value="990000"></div>'+
    '<div class="field"><label>توضیح کوتاه</label><textarea id="ncDesc" class="input" placeholder="توضیح دوره..."></textarea></div>'+
    '<button class="btn btn-primary btn-block" onclick="insAddCourse()">انتشار دوره</button>');
}
function insAddCourse(){
  const title=$('#ncTitle').value.trim();
  if(!title||title.length<5){toast('عنوان دوره باید حداقل ۵ کاراکتر باشد','warn');return}
  const price=+$('#ncPrice').value||0;
  const newC={id:'c'+Date.now(),title,cat:$('#ncCat').value,tid:'t1',price,old:null,level:$('#ncLevel').value,rating:5,studs:0,hours:8,letter:title.replace(/[^\u0600-\u06FFa-zA-Z]/g,'').slice(0,2)||'NW',c1:'#6366f1',c2:'#8b5cf6',tag:null,desc:$('#ncDesc').value.trim()||'توضیحات این دوره به‌زودی تکمیل می‌شود.',learn:['مباحث پایه تا پیشرفته','پروژه عملی واقعی'],lessons:[{t:'درس اول',d:'15:00'},{t:'درس دوم',d:'18:00'},{t:'درس سوم',d:'20:00'}],files:[{n:'جزوه دوره',s:'1.2 MB'}],exam:[{q:'آیا دوره را کامل کردید؟',o:['بله','خیر','کامل کردم','تمام شد'],a:0}]};
  COURSES.push(newC);
  saveDB();closeModal();
  pushNotif(getSessionUid(),'دوره جدید','دوره «'+title+'» با موفقیت منتشر شد.');
  toast('دوره با موفقیت منتشر شد');router();
}
function insStudents(myIds){
  const rows=[];
  Object.keys(db.enrolls).forEach(uidKey=>{
    const usr=db.users.find(u=>u.id===uidKey);if(!usr)return;
    db.enrolls[uidKey].forEach(e=>{
      if(!myIds.includes(e.courseId))return;
      const c=courseById(e.courseId);
      rows.push({usr,c,pct:Math.round(e.done.length/c.lessons.length*100)});
    });
  });
  return '<h1 style="font-size:21px;margin-bottom:22px">دانشجویان دوره‌های من</h1>'+
  (rows.length?'<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>دانشجو</th><th>دوره</th><th>پیشرفت</th><th>نمره آزمون</th><th>وضعیت</th></tr></thead><tbody>'+
  rows.map(r=>'<tr><td><b class="small">'+esc(r.usr.name)+'</b></td><td class="small">'+esc(r.c.title)+'</td>'+

    '<div class="row mt2 mb1"><span class="pill blue">'+b.cat+'</span><span class="small muted">'+faDate(b.date)+'</span><span class="small muted">'+esc(teacherName(b.tid))+'</span></div>'+
    '<h1 style="font-size:24px;line-height:1.7">'+esc(b.title)+'</h1>'+
    '<p class="mt2 muted" style="font-size:15.5px">'+esc(b.excerpt)+'</p>'+
    b.body.map(p=>'<p class="mt2" style="font-size:15px;text-align:justify">'+esc(p)+'</p>').join('')+
    '<hr class="divider"><div class="row between"><a class="btn btn-outline" href="#/blog">بازگشت به وبلاگ</a><a class="btn btn-primary" href="#/courses">مشاهده دوره‌های مرتبط</a></div>'+
  '</div>';
}
